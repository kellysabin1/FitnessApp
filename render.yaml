# One-click deploy of the rep. coach server on Render (render.com → New → Blueprint).
services:
  - type: web
    name: rep-coach
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks you to paste this during setup
      - key: APP_TOKEN
        generateValue: true # Render makes a random password; copy it into the app
      # Friends & challenges (Supabase) — see README "Friends & challenges setup"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # secret — paste from Supabase, never share
      - key: APP_URL
        sync: false # your rep-app address, e.g. https://rep-app-xxxx.onrender.com
      # Optional: email reminders (resend.com). Leave unset and only push reminders are sent.
      - key: RESEND_API_KEY
        sync: false # secret — paste from Resend, never share
      - key: REMINDER_FROM
        sync: false # e.g. rep. <reminders@yourdomain.com>

  # The rep. web app — open on your iPhone in Safari, then Share → Add to Home Screen.
  - type: web
    name: rep-app
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers (REP-3/REP-6). e2e/support/serve.mjs applies these same headers in tests, so a
    # policy that breaks the app fails CI. If you add a new outside service, add its host to connect-src.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://kkhpfyxrestlohjvpcit.supabase.co https://rep-coach.onrender.com https://api.ouraring.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_NO_TELEMETRY
        value: "1"
